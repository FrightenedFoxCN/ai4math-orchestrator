name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked -- --test-threads=1
      - run: cargo clippy --workspace --all-targets --locked

  native-lean:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [kernel, rfc]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Lean 4.35.0 (arm64)
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          asset=lean-4.35.0-darwin_aarch64.tar.zst
          archive="$RUNNER_TEMP/$asset"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/leanprover/lean4/releases/download/v4.35.0/$asset"
          printf '%s  %s\n' 'c0c6f34f35ba1dcc5c4a5fd106fefab9eb5e8469712624dd2c868d51b63177c2' "$archive" | shasum -a 256 -c -
          prefix="$RUNNER_TEMP/ai4math-lean-4.35.0"
          mkdir "$prefix"
          tar --strip-components 1 -xf "$archive" -C "$prefix"
          printf 'AI4MATH_TEST_LEAN=%s/bin/lean\n' "$prefix" >> "$GITHUB_ENV"
      - name: Run native Lean ${{ matrix.group }} gates
        run: bash .github/native-lean${{ matrix.group == 'rfc' && '-rfc' || '' }}.sh

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix plugins/dsh-ai4math test
