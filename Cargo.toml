[workspace]
members = ["crates/ai4math-core", "crates/ai4math-store", "crates/ai4math-broker", "crates/ai4math-evidence", "crates/ai4math-project", "crates/ai4math-git", "crates/ai4math-cli", "crates/ai4math-daemon"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
libc = "0.2"
tempfile = "3"
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
ai4math-core = { path = "crates/ai4math-core" }
ai4math-store = { path = "crates/ai4math-store" }
ai4math-broker = { path = "crates/ai4math-broker" }
ai4math-evidence = { path = "crates/ai4math-evidence" }
ai4math-project = { path = "crates/ai4math-project" }
ai4math-git = { path = "crates/ai4math-git" }
